name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Seed corpus
        run: fuzz/seed.sh

      # Short deterministic bursts: catches panic/OOM regressions in the
      # decode/validate/lower pipeline without a long fuzzing session.
      - name: Fuzz decode
        run: cargo fuzz run decode -- -runs=50000

      - name: Fuzz validate_lower
        run: cargo fuzz run validate_lower -- -runs=50000

      - name: Fuzz smith_module
        run: cargo fuzz run smith_module -- -runs=5000

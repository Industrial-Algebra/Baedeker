[package]
name = "baedeker-core"
description = "WebAssembly runtime core — decode, validate, execute (no_std)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
std = []
# serde derives on the register IR (used by the `aot` feature and IA tooling).
serde = ["dep:serde"]
# AOT artifact envelope: postcard-serialized RegModule with magic/version.
aot = ["serde", "dep:postcard"]

[dependencies]
libm = "0.2"
serde = { version = "1", optional = true, default-features = false, features = [
    "derive",
    "alloc",
] }
postcard = { version = "1", optional = true, default-features = false, features = [
    "alloc",
] }

[dev-dependencies]
baedeker-testdata = { path = "../baedeker-testdata" }
wast = "240"
wasm-smith = "0.254"
arbitrary = "1"

# Differential oracle: Pulley-interpreter build (no cranelift) keeps CI
# compile times reasonable.
wasmtime = { version = "47", default-features = false, features = [
    "runtime",
    "std",
    "wat",
    "winch",
] }

[package]
name = "baedeker-ffi"
description = "C-compatible FFI for the Baedeker WebAssembly runtime (staticlib/cdylib)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
baedeker-core = { path = "../baedeker-core", version = "0.1.0", features = ["aot"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
cc = "1"
wast = "240"

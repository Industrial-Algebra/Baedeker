[package]
name = "baedeker-ffi"
description = "C-compatible FFI for the Baedeker WebAssembly runtime (staticlib/cdylib)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
baedeker-core = { path = "../baedeker-core", features = ["aot"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
cc = "1"
wast = "240"

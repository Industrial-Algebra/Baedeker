[package]
name = "baedeker-borsalino"
description = "Borsalino GPU backend adapter for the Baedeker WebAssembly runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
baedeker-core = { path = "../baedeker-core", version = "0.1.0" }
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
borsalino = { version = "0.6.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
borsalino = { version = "0.6.0", features = ["vulkan"] }
